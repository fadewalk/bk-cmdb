openapi: 3.0.3
info:
  title: CMDB Open API
  version: 1.0.0
  description: Independent CMDB compatibility API. The /api/v3 paths are the existing
    CMDB business endpoints; BlueKing API Gateway publication extensions are intentionally
    excluded.
servers:
- url: /
  description: CMDB deployment
tags:
- name: models
  description: Model and attribute operations
- name: instances
  description: Instance and association operations
- name: hosts
  description: Host, module and cloud-area operations
- name: businesses
  description: Business and topology operations
- name: processes
  description: Process and service-template operations
- name: topology
  description: Topology queries
- name: system
  description: Other CMDB operations
security:
- apiKey: []
- bearerAuth: []
