apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmdb-kube-sync
  namespace: cmdb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmdb-kube-sync-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmdb-kube-sync-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cmdb-kube-sync-read
subjects:
  - kind: ServiceAccount
    name: cmdb-kube-sync
    namespace: cmdb
